<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Metallic Silver/Platinum Accent Gradient -->
    <linearGradient id="silverGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Sharp Amber / Gold Edge Highlight -->
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Rim -->
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#silverGrad1)" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Geometric Luxury "X" Icon Group -->
  <g filter="url(#subtleGlow)" transform="translate(0, -10)">
    <!-- Diagonal Blade 1 (Top-Left to Bottom-Right) -->
    <path d="M125 130 L185 130 L387 370 L327 370 Z" fill="url(#silverGrad1)"/>
    
    <!-- Diagonal Blade 2 (Top-Right to Bottom-Left with Streetwear Cyber Notch) -->
    <path d="M387 130 L327 130 L276 191 L306 227 Z" fill="url(#silverGrad1)"/>
    <path d="M125 370 L185 370 L236 309 L206 273 Z" fill="url(#silverGrad1)"/>

    <!-- Center Cyber Core Accent (Amber / Gold Notch) -->
    <polygon points="256,220 286,256 256,292 226,256" fill="url(#amberGlow)"/>
  </g>

  <!-- Minimal Brand Sub-Label -->
  <text x="256" y="440" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="9" 
        opacity="0.95">
    STYLE ZONE
  </text>
  
  <!-- Bottom Accent Dot Line -->
  <circle cx="256" cy="465" r="3.5" fill="#F59E0B" />
</svg>
